name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/cinestream-temporary-upload.jks" \
            -storepass "temporary-build-only-password" \
            -keypass "temporary-build-only-password" \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CineStream Build, OU=Android, O=CineStream, L=Unknown, ST=Unknown, C=DZ"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/cinestream-temporary-upload.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=temporary-build-only-password" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=temporary-build-only-password" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
